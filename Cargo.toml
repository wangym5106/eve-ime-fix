[package]
name = "eve-ime-fix"
version = "0.1.0"
edition = "2021"
authors = ["Kidding Serenity"]
license = "GPL-3.0-or-later"
description = "修复 EVE Online 输入法候选框不显示问题"
readme = "README.md"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
